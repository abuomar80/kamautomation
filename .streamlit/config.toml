[server]
# Maximum file upload size in MB
# Default is 200 MB, now increased to 800 MB
maxUploadSize = 800

# Enable file watcher for better development experience
fileWatcherType = "auto"

# Allow cross-origin requests (useful for development)
enableCORS = false

# Enable XSRF protection
enableXsrfProtection = true

[browser]
# Automatically gather usage stats
gatherUsageStats = false

[theme]
# You can customize theme here if needed
# base = "light"
